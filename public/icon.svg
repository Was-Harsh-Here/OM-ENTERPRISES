<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="8" opacity="0.8" />

  <!-- Center Card Emblem -->
  <rect x="106" y="106" width="300" height="300" rx="48" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Grid / Card Overlay -->
  <rect x="120" y="120" width="272" height="272" rx="38" fill="#1e1b4b" opacity="0.6" />

  <!-- Indian Rupee + OM Fintech Symbol -->
  <!-- Top Bar -->
  <rect x="176" y="180" width="160" height="22" rx="11" fill="#ffffff" />
  <!-- Second Bar -->
  <rect x="176" y="222" width="130" height="20" rx="10" fill="#ffffff" />
  
  <!-- Curved Upper Loop -->
  <path d="M 230 222 C 300 222 300 300 230 300 L 190 300" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  
  <!-- Downward Leg -->
  <line x1="220" y1="295" x2="320" y2="395" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

  <!-- Dynamic Signal/Network Pulses (Top Right - Telecom LAPU) -->
  <circle cx="345" cy="165" r="14" fill="url(#accentGrad)" />
  <path d="M 330 145 A 25 25 0 0 1 370 185" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 320 135 A 40 40 0 0 1 385 200" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- OM Branding Label -->
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="6">OM CMS</text>
</svg>
